services:
  api:
    build: .
    image: flux-glyph:local
    ports:
      - "9000:9000"
    environment:
      FLUX_API_TOKEN: ${FLUX_API_TOKEN:-}
      FLUX_FONT_CACHE_CHARACTERS: "32"
      FLUX_MAX_UPLOAD_MB: "8"
      FLUX_MAX_PIXELS: "12000000"
      FLUX_MAX_REGIONS: "200"
      FLUX_QUEUE_SIZE: "8"
      FLUX_MAX_SAVED_JOBS: "100"
      FLUX_RETENTION_HOURS: "24"
    volumes:
      - ./models:/app/models:ro
      - glyph-data:/app/data
    cpus: 2.0
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 120s
volumes:
  glyph-data:
